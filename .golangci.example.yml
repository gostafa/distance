---
# Example golangci-lint v2 config enabling the distance Module Plugin.
# Requires a custom binary built from .custom-gcl.yml (golangci-lint custom).
version: '2'
linters:
  default: none
  enable: [distance]
  settings:
    custom:
      distance:
        type: module
        description: Enforce Go main-sequence distance policy thresholds
        settings:
          tests: false
          generated: false
          dependency-scope: module
          patterns: [./...]

          # Most specific import-path glob wins. Empty rules defaults to
          # [{pattern: "**", max: 0.5}].
          rules:
            - pattern: "**"
              max: 0.5
            - pattern: "**/internal/**"
              max: 0.2
