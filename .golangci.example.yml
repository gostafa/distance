---
# Example golangci-lint v2 config enabling the distance Module Plugin.
# Requires a custom binary built from .custom-gcl.yml (golangci-lint custom).
version: '2'
linters:
  default: none
  enable: [distance]
  settings:
    custom:
      distance:
        type: module
        description: Enforce Go main-sequence distance policy thresholds
        settings:
          tests: false
          generated: false
          dependency-scope: module

          # First matching rule wins. Empty packages defaults to
          # [{pattern: ./..., max-distance: 0.5}].
          packages:
            - pattern: ./internal/domain/...
              max-distance: 0.2
            - pattern: ./...
              max-distance: 0.5
