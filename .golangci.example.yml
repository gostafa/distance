---
# Example golangci-lint v2 config enabling the distance Module Plugin.
# Requires a custom binary built from .custom-gcl.yml (golangci-lint custom).
version: '2'
linters:
  default: none
  enable: [distance]
  settings:
    custom:
      distance:
        type: module
        description: Enforce Go main-sequence distance policy thresholds
        settings:
          patterns: [./...]
          tests: false
          generated: false
          dependency-scope: module

          # Policy limits are configured inline. A bare number is shorthand
          # for max. Remove all policy sections to use the recommended
          # defaults. Hidden metrics (abstractness, instability) are rejected.
          funcs:
            lines:
              max: 80
          package:
            types:
              max: 12
            funcs:
              max: 30
            vars:
              max: 20
            consts:
              max: 30
            afferent:
              max: 20
            efferent:
              max: 10
            metrics:
              distance:
                max: 0.5
          type:
            fields:
              max: 8
            methods:
              max: 10
